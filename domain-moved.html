<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5; url=https://blrocky.com/">
  <title>BL Rocky has moved</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #100b0d; color: #fff; }
    main { width: min(34rem, calc(100% - 2rem)); text-align: center; }
    a { display: inline-block; margin-top: 1rem; color: #ffd34e; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>We have moved domains</h1>
    <p>Your browser should take you to the new BL Rocky site automatically.</p>
    <p>If the redirect was blocked, <a href="https://blrocky.com/">click here for blrocky.com</a>.</p>
  </main>
  <script>window.setTimeout(() => window.location.replace("https://blrocky.com/"), 5000);</script>
</body>
</html>
